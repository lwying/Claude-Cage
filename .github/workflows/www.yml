name: Website and public releases
on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'README*.md', 'docs/guide/**', 'scripts/agent-*.mjs', 'scripts/verify-macos-release.sh', '.github/workflows/www.yml']
  pull_request:
    paths: ['www/**', 'assets/**', 'README*.md', 'docs/guide/**', 'scripts/agent-*.mjs', 'scripts/verify-macos-release.sh', '.github/workflows/www.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional public release tag to download and verify before deployment'
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Exact published Cage release to verify and deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name }}-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: (github.event_name == 'release' && !github.event.release.draft) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Tags can predate this workflow. The verification tools live on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download public assets and verify SHA-256
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node www/scripts/sync-release.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release.json" --archive-directory "$RUNNER_TEMP/release"
      - name: Verify the shipped macOS application
        run: bash scripts/verify-macos-release.sh "$RUNNER_TEMP/release"
  build:
    needs: verify-release
    if: always() && !cancelled() && (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci --prefix www
      - run: node --test www/scripts/sync-release.test.mjs
      - name: Agent package discovery and verification
        run: node --test scripts/agent-bootstrap.test.mjs
      - name: Resolve the public download version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            node www/scripts/sync-release.mjs --tag "$RELEASE_TAG"
          else
            node www/scripts/sync-release.mjs
          fi
      - run: npm run --prefix www check
      - run: npm run --prefix www build
      - run: node www/scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www/dist
  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
